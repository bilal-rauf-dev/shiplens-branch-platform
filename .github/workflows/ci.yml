name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check CSS and view conventions
        run: python bin/check_conventions.py

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-placeholder-signing-key-not-used-for-deployment-0123456789
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shiplens
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: https://example.com
      DEMO_MODE: "false"
      DJANGO_SETTINGS_MODULE: config.settings.test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiplens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shiplens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext
      - name: Compile Urdu catalogue
        run: python manage.py compilemessages -l ur --ignore=.venv --ignore=.tmp
      - name: Check production settings
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Check translation message coverage
        run: python bin/check_translations.py
      - name: Check translation configuration
        run: python manage.py check --tag translation
      - name: Test with coverage gate
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - name: Write coverage summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("coverage.xml")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              if report.exists():
                  total = float(ElementTree.parse(report).getroot().attrib["line-rate"]) * 100
                  summary.write(f"Coverage: **{total:.2f}%** (required: 90%).\n")
              else:
                  summary.write("Coverage report unavailable; inspect the test step.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install locked audit tool
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only needed for organization-owned repositories.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: shiplens-ci
      CI_WEB_PORT: "8000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag shiplens:ci .
      - name: Start production stack and wait for health
        run: docker compose -f docker-compose.ci.yml up --detach --wait --wait-timeout 120
      - name: Check health endpoint and non-root user
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f docker-compose.ci.yml ps -q web)")" = healthy
          container_user=$(docker run --rm shiplens:ci id -u)
          test "$container_user" = 10001
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color
      - name: Remove CI containers and disposable database
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes


  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: shiplens-e2e
      CI_WEB_PORT: "8000"
      BASE_URL: http://localhost:8000
      DEMO_PASSWORD: ci-only-demo-password-not-for-live-0123456789
      SECRET_KEY: ci-only-placeholder-signing-key-not-used-for-deployment-0123456789
      DATABASE_URL: postgres://unused:unused@localhost/unused
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install locked test dependencies and Chromium
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Build production image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag shiplens:ci .
      - name: Start seeded stack and wait for health
        run: docker compose -f docker-compose.ci.yml -f docker-compose.e2e.yml up --detach --wait --wait-timeout 120
      - name: Run Chromium journeys and axe checks
        run: pytest tests/e2e -m e2e --browser chromium --no-cov --tracing retain-on-failure --screenshot only-on-failure --output test-results/e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure-evidence
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml -f docker-compose.e2e.yml logs --no-color
      - name: Remove disposable stack
        if: always()
        run: docker compose -f docker-compose.ci.yml -f docker-compose.e2e.yml down --volumes

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: shiplens-lighthouse
      CI_WEB_PORT: "8000"
      DEMO_PASSWORD: ci-only-demo-password-not-for-live-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag shiplens:ci .
      - name: Start seeded stack and wait for health
        run: docker compose -f docker-compose.ci.yml -f docker-compose.e2e.yml up --detach --wait --wait-timeout 120
      # CI uses HTTP localhost. Only is-on-https is disabled in lighthouserc.json;
      # HTTPS must also be checked manually on the live deployment.
      - name: Audit five pages with three mobile runs each
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.1
        with:
          configPath: ./lighthouserc.json
          runs: 3
          uploadArtifacts: false
          temporaryPublicStorage: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml -f docker-compose.e2e.yml logs --no-color
      - name: Remove disposable stack
        if: always()
        run: docker compose -f docker-compose.ci.yml -f docker-compose.e2e.yml down --volumes
