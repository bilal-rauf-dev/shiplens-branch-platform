# Overlay for the disposable CI stack; never use a live site's demo password.
services:
  web:
    ports: !reset []
    environment:
      DEMO_MODE: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set a disposable DEMO_PASSWORD}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
  browser-proxy:
    image: shiplens:ci
    entrypoint: ["python", "/browser_proxy.py"]
    command: []
    environment:
      CI_PROXY_BIND: 0.0.0.0
    volumes:
      - ./bin/browser_proxy.py:/browser_proxy.py:ro
    ports:
      - "127.0.0.1:${CI_WEB_PORT:-8000}:8000"
    depends_on:
      web:
        condition: service_healthy
