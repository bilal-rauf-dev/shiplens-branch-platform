# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: shiplens-web
    runtime: docker
    branch: main
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shiplens-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_ALLOWED_HOSTS
        value: shiplens-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://shiplens-web.onrender.com
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: shiplens-db
    postgresMajorVersion: "16"
    region: singapore
    plan: free
