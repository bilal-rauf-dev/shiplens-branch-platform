{{ form.non_field_errors }}
{% for field in form %}
  <div class="form-field{% if field.errors %} form-field--error{% endif %}">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
