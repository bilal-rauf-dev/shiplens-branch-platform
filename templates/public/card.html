{% load i18n static %}<a class="card card--interactive public-card{% if featured_card %} card--featured{% endif %}" href="{% if content.type == 'EVENT' %}{% url 'public-event-detail' content.slug %}{% else %}{% url 'public-program-detail' content.slug %}{% endif %}">
{% if content.image_path %}<img src="{% static content.image_path %}" width="400" height="300" alt="" loading="lazy">{% endif %}<div><h3 class="type-title-l">{{ content.title }}</h3><p>{{ content.summary }}</p>{% if content.event_start %}<p><bdi>{{ content.event_start|date:"d M Y" }}</bdi> · {{ content.location }}</p>{% endif %}<span class="public-card__link">{% translate "Learn more" %} <span aria-hidden="true">↗</span></span></div></a>
